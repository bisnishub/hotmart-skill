<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!--
  TEMPLATE NEUTRO — banner de divulgação/afiliado (1200×628, feed e link preview).
  Edite as CSS vars e os textos <!-- EDITE -->. Depois:
    bash scripts/gerar-asset.sh templates/banner-afiliado-1200x628.html banner.png 1200x628
-->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#131013; --fg:#F5F1EA; --accent:#F04E23; --accent2:#FFB800; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:1200px;height:628px;overflow:hidden;background:var(--bg);color:var(--fg);
       font-family:'Space Grotesk',sans-serif;position:relative;}
  .glow{position:absolute;top:-240px;right:-120px;width:760px;height:760px;border-radius:50%;
        background:radial-gradient(closest-side, color-mix(in srgb, var(--accent) 34%, transparent), transparent 70%);}
  .hair{position:absolute;left:64px;right:64px;height:2px;background:color-mix(in srgb, var(--fg) 12%, transparent);}
  .wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 88px;}
  .left{max-width:720px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;
        letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin-bottom:20px;}
  h1{font-weight:700;font-size:64px;line-height:1.04;letter-spacing:-0.02em;}
  h1 .g{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;color:transparent;}
  .cta{display:inline-block;margin-top:34px;font-family:'JetBrains Mono',monospace;font-size:17px;
        font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--bg);
        background:var(--accent);border-radius:10px;padding:18px 34px;}
  .logo{font-size:220px;flex-shrink:0;filter:drop-shadow(0 20px 60px color-mix(in srgb, var(--accent) 40%, transparent));}
  .foot{position:absolute;bottom:26px;left:88px;font-family:'JetBrains Mono',monospace;
        font-size:12px;letter-spacing:.24em;text-transform:uppercase;opacity:.4;}
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="hair" style="top:44px"></div>
  <div class="hair" style="bottom:64px"></div>
  <div class="wrap">
    <div class="left">
      <p class="eyebrow">Nome da marca · lançamento</p>              <!-- EDITE -->
      <h1>Promessa direta<br>com <span class="g">prazo real.</span></h1> <!-- EDITE -->
      <span class="cta">Quero minha vaga →</span>                    <!-- EDITE -->
    </div>
    <div class="logo">🚀</div>                                       <!-- EDITE -->
  </div>
  <p class="foot">prova social real · garantia · aqui</p>            <!-- EDITE -->
</body>
</html>
